name: HAWK-X native vision smoke test

on:
  pull_request:
    paths:
      - 'vision-ai/**'
      - '.github/workflows/native-vision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vision-ai/requirements-native.txt
      - name: Unit tests
        run: python -m unittest discover -s vision-ai -p 'test_native.py'
      - name: Train and predict using synthetic shapes (not people)
        run: |
          python vision-ai/make_demo_dataset.py --samples 16
          python vision-ai/train_native.py --data vision-ai/demo-data/annotations.json --epochs 1 --batch-size 4
          python vision-ai/detect.py --image vision-ai/demo-data/images/sample_001.png
          test -s vision-ai/output/detections.json
          test -s vision-ai/output/preview.jpg
